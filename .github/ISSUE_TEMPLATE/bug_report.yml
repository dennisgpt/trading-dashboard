name: Bug melden
description: Etwas funktioniert nicht wie erwartet
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was ist passiert, was hättest du erwartet?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. App öffnen
        2. ...
  - type: input
    id: version
    attributes:
      label: App-Version
      placeholder: z. B. 0.1.0
  - type: dropdown
    id: os
    attributes:
      label: Betriebssystem
      options: [Windows 11, Windows 10, macOS, Andere]
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
